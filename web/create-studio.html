

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101020">
<title>DevGatha Create Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101020;color:#fff;font-family:Arial,sans-serif;padding:16px}
header{text-align:center;color:#ffd84d}
h1{margin-bottom:6px}
.sub{color:#bbb;font-size:14px}
.panel{max-width:650px;margin:18px auto;background:#1b1b31;border:1px solid #353550;border-radius:18px;padding:18px}
label{display:block;margin:14px 0 7px;font-weight:bold}
input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid #444461;background:#101020;color:white;font-size:16px}
textarea{min-height:75px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 15px;background:#ffcf38;color:#151515;font-size:15px;font-weight:bold;cursor:pointer}
.secondary{background:#343450;color:white}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row button{flex:1}
#preview{display:none;width:100%;margin-top:12px;border-radius:12px;max-height:260px;object-fit:contain;background:#101020}
#status{white-space:pre-wrap;color:#8ef5b0;margin-top:12px}
#poster{width:100%;aspect-ratio:16/9;background:#252344;border-radius:12px;margin-top:14px}
.small{font-size:13px;color:#bdbdd0;line-height:1.5}
</style>
</head>
<body>
<header>
  <h1>DevGatha Quiz</h1>
  <div class="sub">CREATE STUDIO • अपना क्विज़ बनाओ</div>
</header>

<main class="panel">
  <h2>🛠️ अपना क्विज़ बनाओ</h2>

  <label for="quizTitle">क्विज़ का नाम</label>
  <input id="quizTitle" maxlength="80" placeholder="जैसे: मेरा GK Quiz">

  <label for="question">अपना सवाल लिखो</label>
  <textarea id="question" maxlength="500" placeholder="तुम्हारा सवाल क्या है?"></textarea>

  <label>चार विकल्प लिखो</label>
  <input id="o0" maxlength="200" placeholder="विकल्प A">
  <input id="o1" maxlength="200" placeholder="विकल्प B" style="margin-top:8px">
  <input id="o2" maxlength="200" placeholder="विकल्प C" style="margin-top:8px">
  <input id="o3" maxlength="200" placeholder="विकल्प D" style="margin-top:8px">

  <label for="correct">सही उत्तर चुनो</label>
  <select id="correct">
    <option value="0">विकल्प A</option>
    <option value="1">विकल्प B</option>
    <option value="2">विकल्प C</option>
    <option value="3">विकल्प D</option>
  </select>

  <label for="photo">📱 फोन की Gallery से फोटो/PNG चुनो</label>
  <input id="photo" type="file" accept="image/*">
  <img id="preview" alt="चुनी हुई फोटो का प्रीव्यू">

  <div class="row">
    <button id="saveQuiz">क्विज़ सेव करो</button>
    <button id="startQuiz" class="secondary">क्विज़ खेलो</button>
  </div>

  <div id="playArea" hidden>
    <hr style="border-color:#444">
    <h3 id="playQuestion"></h3>
    <div id="playOptions"></div>
    <p id="playResult"></p>
  </div>

  <h3>🖼️ 16:9 रिज़ल्ट कार्ड</h3>
  <canvas id="poster" width="1920" height="1080"></canvas>
  <p class="small">PNG कार्ड 1920 × 1080 पिक्सेल में बनेगा। चुनी हुई फोटो कार्ड में लगाई जा सकती है।</p>
  <div class="row">
    <button id="makePoster">PNG बनाओ और सेव करो</button>
  </div>
  <div class="row">
    <button id="showSaved" class="secondary">सेव किए क्विज़ देखो</button>
  </div>
  <div id="savedList"></div>
  <div id="status" role="status"></div>
</main>

<script>
(function(){
  const $ = id => document.getElementById(id);
  let chosenImage = null;
  let currentQuiz = null;
  let score = 0;
  let answered = false;

  $('photo').addEventListener('change', function(){
    const file = this.files && this.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/')){
      $('status').textContent = 'कृपया image फ़ाइल चुनो।';
      return;
    }
    if(file.size > 10 * 1024 * 1024){
      $('status').textContent = 'फोटो 10 MB से छोटी चुनो।';
      this.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      chosenImage = new Image();
      chosenImage.onload = () => {
        $('preview').src = reader.result;
        $('preview').style.display = 'block';
        $('status').textContent = 'फोटो चुन ली गई।';
      };
      chosenImage.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  function getQuiz(){
    const title = $('quizTitle').value.trim();
    const question = $('question').value.trim();
    const options = ['o0','o1','o2','o3'].map(id => $(id).value.trim());
    if(!title || !question || options.some(x => !x)){
      throw new Error('क्विज़ का नाम, सवाल और चारों विकल्प भरो।');
    }
    return {
      id: Date.now(),
      title, question, options,
      correct: Number($('correct').value),
      createdAt: new Date().toISOString()
    };
  }

  $('saveQuiz').addEventListener('click', function(){
    try{
      const quiz = getQuiz();
      const all = JSON.parse(localStorage.getItem('devgathaCustomQuizzes') || '[]');
      all.unshift(quiz);
      localStorage.setItem('devgathaCustomQuizzes', JSON.stringify(all.slice(0,100)));
      currentQuiz = quiz;
      $('status').textContent = 'क्विज़ इस डिवाइस पर सेव हो गया!';
    }catch(e){
      $('status').textContent = e.message || 'क्विज़ सेव नहीं हो पाया।';
    }
  });

  $('startQuiz').addEventListener('click', function(){
    try{
      currentQuiz = getQuiz();
      score = 0;
      answered = false;
      $('playArea').hidden = false;
      $('playQuestion').textContent = currentQuiz.question;
      $('playResult').textContent = '';
      const area = $('playOptions');
      area.replaceChildren();
      currentQuiz.options.forEach((option,i) => {
        const b = document.createElement('button');
        b.textContent = String.fromCharCode(65+i) + '. ' + option;
        b.style.cssText = 'display:block;width:100%;margin:8px 0;text-align:left';
        b.addEventListener('click', () => {
          if(answered) return;
          answered = true;
          score = i === currentQuiz.correct ? 1 : 0;
          $('playResult').textContent = score
            ? '🎉 सही उत्तर! स्कोर: 1/1'
            : 'स्कोर: 0/1 — सही उत्तर: ' + currentQuiz.options[currentQuiz.correct];
        });
        area.appendChild(b);
      });
    }catch(e){
      $('status').textContent = e.message;
    }
  });

  function drawCover(ctx,img,x,y,w,h){
    const scale = Math.max(w/img.width,h/img.height);
    const sw = w/scale, sh = h/scale;
    const sx = (img.width-sw)/2, sy = (img.height-sh)/2;
    ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
  }

  $('makePoster').addEventListener('click', function(){
    try{
      const quiz = currentQuiz || getQuiz();
      const c = $('poster'), ctx = c.getContext('2d');
      ctx.fillStyle = '#17152f';
      ctx.fillRect(0,0,c.width,c.height);

      if(chosenImage){
        ctx.save();
        ctx.globalAlpha = 0.30;
        drawCover(ctx,chosenImage,1000,0,920,1080);
        ctx.restore();
      }

      ctx.fillStyle = '#ffd84d';
      ctx.font = 'bold 76px Arial';
      ctx.fillText('DEVGATHA QUIZ',100,130);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 58px Arial';
      ctx.fillText(quiz.title.slice(0,36),100,245);

      ctx.font = 'bold 48px Arial';
      const words = quiz.question.split(/\s+/);
      let line = '', y = 370;
      for(const word of words){
        const test = line ? line+' '+word : word;
        if(ctx.measureText(test).width > 1600 && line){
          ctx.fillText(line,100,y);
          y += 65;
          line = word;
        }else line = test;
        if(y > 610) break;
      }
      if(line && y <= 610) ctx.fillText(line,100,y);

      ctx.font = '40px Arial';
      let oy = Math.max(y+110,680);
      quiz.options.forEach((opt,i) => {
        ctx.fillStyle = i === quiz.correct ? '#9ff5b1' : '#e7e6ff';
        ctx.fillText(String.fromCharCode(65+i)+'. '+opt.slice(0,55),120,oy);
        oy += 78;
      });

      ctx.fillStyle = '#ff70c8';
      ctx.font = 'bold 36px Arial';
      ctx.fillText('CREATE • PLAY • LEARN',100,1020);

      c.toBlob(blob => {
        if(!blob){
          $('status').textContent = 'PNG नहीं बन पाया।';
          return;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'DevGatha-Quiz-' + Date.now() + '.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url),30000);
        $('status').textContent =
          'PNG तैयार है। अगर ऐप में Gallery में सीधे सेव न हो, तो फ़ाइल डाउनलोड्स में मिलेगी।';
      },'image/png');
    }catch(e){
      $('status').textContent = e.message || 'PNG बनाने में समस्या हुई।';
    }
  });

  $('showSaved').addEventListener('click', function(){
    const list = JSON.parse(localStorage.getItem('devgathaCustomQuizzes') || '[]');
    const target = $('savedList');
    target.replaceChildren();
    if(!list.length){
      target.textContent = 'अभी कोई क्विज़ सेव नहीं है।';
      return;
    }
    list.forEach(q => {
      const b = document.createElement('button');
      b.className = 'secondary';
      b.style.cssText = 'display:block;width:100%;margin:8px 0;text-align:left';
      b.textContent = q.title + ' — ' + q.question;
      b.addEventListener('click', () => {
        $('quizTitle').value = q.title;
        $('question').value = q.question;
        q.options.forEach((v,i) => $('o'+i).value = v);
        $('correct').value = String(q.correct);
        currentQuiz = q;
        $('status').textContent = 'क्विज़ एडिट करने के लिए लोड हो गया।';
      });
      target.appendChild(b);
    });
  });
})();
</script>
</body>
</html>
